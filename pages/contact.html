<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact Andreas Papaeracleous." />
    <title>Contact — Andreas Papaeracleous</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Code+Pro:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="../styles.css" />
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header shell" data-site-header></header>
    <main id="main">
        <section class="contact shell">
            <p class="eyebrow">contact</p>
            <h1>Say hello.</h1>
            <p>For a conversation, collaboration, or a recommendation, send a message below.</p>
            <form class="contact-form" id="contact-form" action="https://formspree.io/f/mvkgovdb" method="POST">
                <div class="contact-form__field"><label for="contact-name">Name</label><input id="contact-name"
                        name="name" type="text" autocomplete="name" required data-fs-field /><span
                        class="contact-form__error" data-fs-error="name"></span></div>
                <div class="contact-form__field"><label for="contact-email">Email</label><input id="contact-email"
                        name="email" type="email" autocomplete="email" required data-fs-field /><span
                        class="contact-form__error" data-fs-error="email"></span></div>
                <div class="contact-form__field"><label for="contact-message">Message</label><textarea
                        id="contact-message" name="message" rows="7" required data-fs-field></textarea><span
                        class="contact-form__error" data-fs-error="message"></span></div><input type="hidden"
                    name="_subject" value="New message from Andreas Papaeracleous’s website" />
                <div class="contact-form__status" aria-live="polite">
                    <p data-fs-success></p>
                    <p data-fs-error></p>
                </div><button class="contact-form__submit" type="submit" data-fs-submit-btn>Send message <span
                        aria-hidden="true">→</span></button>
            </form>
        </section>
    </main>
    <footer class="site-footer shell" data-site-footer></footer>
    <script src="../script.js"></script>
    <script>window.formspree = window.formspree || function () {(formspree.q = formspree.q || []).push(arguments);}; formspree('initForm', {formElement: '#contact-form', formId: 'mvkgovdb'});</script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    <script data-goatcounter="https://andreaspapas.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>

</html>
